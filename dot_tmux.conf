# Pass modified keys (e.g. Shift+Enter in Claude Code) through to apps that
# request them, instead of collapsing them to the bare key.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Let apps send escape sequences (e.g. OSC 52 clipboard) to the outer terminal.
set -g allow-passthrough on
